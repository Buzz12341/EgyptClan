<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Клан Египет | Главная</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --gold: #d4a84b;
            --gold-light: #f0d68a;
            --gold-dark: #a8832f;
            --bg-dark: #0d0a07;
            --bg-card: #1a1510;
            --border-gold: rgba(212, 168, 75, 0.3);
            --text-light: #f0e6d8;
            --text-muted: #b0a090;
            --shadow-gold: 0 0 40px rgba(212, 168, 75, 0.08);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(80, 60, 30, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(40, 60, 40, 0.3) 0%, transparent 60%),
                repeating-linear-gradient(45deg, #110e0a 0px, #110e0a 2px, #1a1510 2px, #1a1510 4px);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 30px;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-12px) rotate(2deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(212, 168, 75, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(212, 168, 75, 0.25);
            }
        }

        .animate {
            animation: fadeInUp 0.8s ease forwards;
        }

        .delay-1 {
            animation-delay: 0.1s;
            opacity: 0;
        }
        .delay-2 {
            animation-delay: 0.2s;
            opacity: 0;
        }
        .delay-3 {
            animation-delay: 0.3s;
            opacity: 0;
        }
        .delay-4 {
            animation-delay: 0.4s;
            opacity: 0;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: linear-gradient(180deg, #1f1812 0%, #0d0a07 100%);
            border-bottom: 2px solid var(--gold);
            padding: 20px 0 14px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }

        .header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header .logo-icon {
            font-size: 42px;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(212, 168, 75, 0.3));
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 6px;
            position: relative;
        }

        .header h1::after {
            content: "𓂀";
            font-size: 24px;
            -webkit-text-fill-color: initial;
            color: var(--gold);
            margin-left: 10px;
            opacity: 0.5;
        }

        .header .subhead {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 10px;
            font-weight: 300;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .header .subhead span {
            color: var(--gold);
            opacity: 1;
        }

        /* ===== ГЕРОЙ ===== */
        .hero {
            background: linear-gradient(145deg, #1a1510, #100d09);
            border-radius: 32px;
            border: 1px solid var(--border-gold);
            padding: 60px 40px 50px;
            margin-bottom: 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(212, 168, 75, 0.03);
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .hero::before {
            content: "𓋴";
            position: absolute;
            top: -40px;
            right: -20px;
            font-size: 200px;
            opacity: 0.04;
            transform: rotate(15deg);
            pointer-events: none;
            font-family: serif;
        }

        .hero::after {
            content: "𓃥";
            position: absolute;
            bottom: -40px;
            left: -20px;
            font-size: 180px;
            opacity: 0.04;
            transform: rotate(-10deg);
            pointer-events: none;
            font-family: serif;
        }

        .hero .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .hero .hero-title .accent {
            background: none;
            -webkit-text-fill-color: initial;
            color: #f0e6d8;
        }

        .hero .hero-desc {
            font-size: 20px;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 32px;
            line-height: 1.9;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }

        .hero .hero-desc strong {
            color: var(--gold);
            font-weight: 700;
        }

        .hero .hero-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .hero .hero-stats .stat {
            text-align: center;
            background: rgba(26, 21, 16, 0.7);
            padding: 18px 28px;
            border-radius: 18px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(6px);
            min-width: 120px;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .hero .hero-stats .stat:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 12px 40px rgba(212, 168, 75, 0.15);
        }

        .hero .hero-stats .stat .number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(212, 168, 75, 0.15);
            line-height: 1.2;
        }

        .hero .hero-stats .stat .label {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 300;
        }

        /* ===== КНОПКИ-КАРТОЧКИ (СЕТКА) ===== */
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .grid-buttons .btn-card {
            background: linear-gradient(145deg, #1a1510, #110e0a);
            border-radius: 22px;
            border: 1px solid var(--border-gold);
            padding: 36px 20px 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }

        .grid-buttons .btn-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 168, 75, 0.08), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .grid-buttons .btn-card::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(212, 168, 75, 0.03), transparent 60%);
            animation: shimmer 10s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .grid-buttons .btn-card:hover::before {
            opacity: 1;
        }
        .grid-buttons .btn-card:hover::after {
            opacity: 1;
        }

        .grid-buttons .btn-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 60px rgba(212, 168, 75, 0.15);
        }

        .grid-buttons .btn-card .icon {
            font-size: 52px;
            margin-bottom: 14px;
            display: block;
            line-height: 1;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
            transition: transform 0.4s;
        }

        .grid-buttons .btn-card:hover .icon {
            transform: scale(1.12) rotate(-6deg);
        }

        .grid-buttons .btn-card .btn-label {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .grid-buttons .btn-card .btn-sub {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .grid-buttons .btn-card .badge {
            display: inline-block;
            background: var(--gold);
            color: #0d0a07;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 20px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 14px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(212, 168, 75, 0.2);
        }

        .grid-buttons .btn-card .badge.tg {
            background: #0088cc;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.2);
        }

        .grid-buttons .btn-card .badge.web {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .grid-buttons .btn-card:hover .badge {
            background: var(--gold-light);
            color: #0d0a07;
            box-shadow: 0 0 30px rgba(212, 168, 75, 0.3);
        }

        .grid-buttons .btn-card:hover .badge.tg {
            background: #0099ee;
        }

        /* ===== КНОПКИ В СТРОКУ ===== */
        .row-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
            margin-bottom: 50px;
        }

        .row-buttons .btn-row {
            background: linear-gradient(145deg, #1a1510, #110e0a);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            flex: 0 1 auto;
            position: relative;
            overflow: hidden;
        }

        .row-buttons .btn-row::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 168, 75, 0.06), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .row-buttons .btn-row:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(212, 168, 75, 0.12);
        }

        .row-buttons .btn-row:hover::before {
            opacity: 1;
        }

        .row-buttons .btn-row .icon {
            font-size: 32px;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        .row-buttons .btn-row .label {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: 0.3px;
        }

        .row-buttons .btn-row .arrow {
            color: var(--gold);
            font-size: 22px;
            margin-left: 2px;
            transition: transform 0.3s;
        }

        .row-buttons .btn-row:hover .arrow {
            transform: translateX(6px);
        }

        /* ===== ИНФО-БЛОК ===== */
        .info-block {
            background: linear-gradient(145deg, #1a1510, #100d09);
            border-radius: 24px;
            border: 1px solid var(--border-gold);
            padding: 44px 48px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .info-block::before {
            content: "𓋴";
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 140px;
            opacity: 0.03;
            font-family: serif;
            pointer-events: none;
        }

        .info-block .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 2px solid rgba(212, 168, 75, 0.15);
            padding-bottom: 14px;
        }

        .info-block .title .icon {
            font-size: 32px;
        }

        .info-block p {
            color: var(--text-muted);
            line-height: 1.9;
            font-size: 16px;
            margin-bottom: 14px;
        }

        .info-block p strong {
            color: var(--gold);
            font-weight: 700;
        }

        .info-block ul {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .info-block ul li {
            padding: 6px 0 6px 34px;
            position: relative;
            color: var(--text-light);
            line-height: 1.7;
            font-size: 16px;
        }

        .info-block ul li::before {
            content: "✦";
            position: absolute;
            left: 6px;
            color: var(--gold);
            font-size: 18px;
        }

        /* ===== ФУТЕР ===== */
        .footer {
            text-align: center;
            padding: 30px 20px 25px;
            color: #5a4e42;
            font-size: 13px;
            border-top: 1px solid rgba(212, 168, 75, 0.08);
            margin-top: 20px;
        }

        .footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .footer .footer-links a {
            color: var(--gold);
            transition: color 0.2s;
            font-weight: 400;
            letter-spacing: 0.5px;
            font-size: 14px;
        }

        .footer .footer-links a:hover {
            color: var(--gold-light);
            text-decoration: underline;
        }

        .footer .copy {
            color: #4a4038;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .footer .copy span {
            color: var(--gold);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 820px) {
            .header h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }
            .hero .hero-title {
                font-size: 42px;
            }
            .hero .hero-desc {
                font-size: 18px;
            }
            .hero .hero-stats {
                gap: 24px;
            }
            .hero .hero-stats .stat {
                padding: 14px 20px;
                min-width: 100px;
            }
            .hero .hero-stats .stat .number {
                font-size: 32px;
            }
            .grid-buttons {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 22px;
            }
            .grid-buttons .btn-card {
                min-height: 170px;
                padding: 28px 16px;
            }
            .grid-buttons .btn-card .icon {
                font-size: 42px;
            }
            .grid-buttons .btn-card .btn-label {
                font-size: 19px;
            }
            .row-buttons .btn-row {
                padding: 14px 24px;
                flex: 1 1 auto;
                justify-content: center;
            }
            .row-buttons .btn-row .label {
                font-size: 16px;
            }
            .info-block {
                padding: 30px 28px;
            }
            .info-block .title {
                font-size: 26px;
            }
        }

        @media (max-width: 500px) {
            .header h1 {
                font-size: 26px;
                letter-spacing: 2px;
            }
            .header .subhead {
                font-size: 10px;
                letter-spacing: 6px;
            }
            .header .logo-icon {
                font-size: 34px;
            }
            .hero {
                padding: 30px 16px;
                border-radius: 24px;
            }
            .hero .hero-title {
                font-size: 32px;
            }
            .hero .hero-desc {
                font-size: 16px;
            }
            .hero .hero-stats {
                gap: 14px;
                flex-direction: column;
                align-items: center;
            }
            .hero .hero-stats .stat {
                width: 100%;
                max-width: 200px;
                padding: 12px 16px;
            }
            .hero .hero-stats .stat .number {
                font-size: 28px;
            }
            .grid-buttons {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .grid-buttons .btn-card {
                min-height: 150px;
                padding: 24px 14px;
            }
            .grid-buttons .btn-card .icon {
                font-size: 38px;
            }
            .grid-buttons .btn-card .btn-label {
