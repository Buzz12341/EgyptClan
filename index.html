<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Клан Египет | Главная</title>

    <!-- ============================================================
    ВЕСЬ CSS ВСТРОЕН ПРЯМО СЮДА
    ============================================================ -->
    <style>
        /* ============================================================
                   ROOT VARIABLES
                   ============================================================ */
        :root {
            --gold: #d4a84b;
            --gold-light: #f0d68a;
            --gold-dark: #a8832f;
            --gold-glow: rgba(212, 168, 75, 0.3);
            --bg-primary: #0b0806;
            --bg-secondary: #15100b;
            --bg-card: #1c1610;
            --border-gold: rgba(212, 168, 75, 0.2);
            --text-primary: #f0e6d8;
            --text-secondary: #b0a090;
            --text-muted: #7a6e62;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.7);
        }

        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 15% 25%, rgba(80, 55, 25, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 75%, rgba(35, 55, 30, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, #0f0b08 0px, #0f0b08 1px, #16100b 1px, #16100b 3px);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 30px;
        }

        /* ============================================================
                   ANIMATIONS
                   ============================================================ */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatY {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-14px);
            }
        }

        @keyframes shimmerGold {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        .anim-fade-up {
            animation: fadeUp 0.9s ease forwards;
        }
        .anim-delay-1 {
            animation-delay: 0.05s;
            opacity: 0;
        }
        .anim-delay-2 {
            animation-delay: 0.15s;
            opacity: 0;
        }
        .anim-delay-3 {
            animation-delay: 0.25s;
            opacity: 0;
        }
        .anim-delay-4 {
            animation-delay: 0.35s;
            opacity: 0;
        }
        .anim-delay-5 {
            animation-delay: 0.45s;
            opacity: 0;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            background: linear-gradient(180deg, #1a1410 0%, #0b0806 100%);
            border-bottom: 2px solid var(--gold);
            padding: 16px 0 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.7);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-logo-icon {
            font-size: 40px;
            animation: floatY 5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 168, 75, 0.2));
        }

        .header h1 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0d68a 0%, #d4a84b 40%, #a8832f 80%, #d4a84b 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
            animation: shimmerGold 8s linear infinite;
        }

        .header h1::after {
            content: "𓂀";
            font-size: 22px;
            -webkit-text-fill-color: initial;
            color: var(--gold);
            margin-left: 12px;
            opacity: 0.4;
        }

        .header-sub {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 4px;
            letter-spacing: 12px;
            font-weight: 300;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .header-sub span {
            color: var(--gold);
            opacity: 1;
        }

        /* ============================================================
                   HERO
                   ============================================================ */
        .hero {
            background: linear-gradient(160deg, #1c1610 0%, #0f0b08 100%);
            border-radius: 32px;
            border: 1px solid var(--border-gold);
            padding: 60px 40px 50px;
            margin-bottom: 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            z-index: 1;
        }

        .hero::before {
            content: "𓋴";
            position: absolute;
            top: -40px;
            right: -20px;
            font-size: 200px;
            opacity: 0.04;
            transform: rotate(20deg);
            pointer-events: none;
            font-family: serif;
        }

        .hero::after {
            content: "𓃥";
            position: absolute;
            bottom: -40px;
            left: -20px;
            font-size: 180px;
            opacity: 0.04;
            transform: rotate(-15deg);
            pointer-events: none;
            font-family: serif;
        }

        .hero-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0d68a 0%, #d4a84b 40%, #a8832f 70%, #d4a84b 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            animation: shimmerGold 10s linear infinite;
        }

        .hero-title .accent {
            background: none;
            -webkit-text-fill-color: initial;
            color: var(--text-primary);
        }

        .hero-desc {
            font-size: 20px;
            color: var(--text-secondary);
            max-width: 750px;
            margin: 0 auto 32px;
            line-height: 1.9;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }

        .hero-desc strong {
            color: var(--gold);
            font-weight: 600;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .hero-stat {
            text-align: center;
            background: rgba(26, 21, 16, 0.6);
            padding: 18px 32px;
            border-radius: 18px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-width: 120px;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .hero-stat:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 12px 48px rgba(212, 168, 75, 0.12);
        }

        .hero-stat .number {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(212, 168, 75, 0.1);
            line-height: 1.2;
        }

        .hero-stat .label {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 300;
        }

        /* ============================================================
                   GRID BUTTONS
                   ============================================================ */
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .btn-card {
            background: linear-gradient(145deg, #1c1610, #120e0a);
            border-radius: 24px;
            border: 1px solid var(--border-gold);
            padding: 38px 20px 32px;
            text-align: center;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            min-height: 210px;
            cursor: pointer;
        }

        .btn-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 168, 75, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .btn-card:hover::before {
            opacity: 1;
        }

        .btn-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 24px 64px rgba(212, 168, 75, 0.12);
        }

        .btn-card .icon {
            font-size: 52px;
            margin-bottom: 16px;
            display: block;
            line-height: 1;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
            transition: transform 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .btn-card:hover .icon {
            transform: scale(1.15) rotate(-6deg);
        }

        .btn-card .btn-label {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .btn-card .btn-sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        .btn-card .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 20px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 14px;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .btn-card .badge-tg {
            background: #0088cc;
            color: #fff;
            box-shadow: 0 0 24px rgba(0, 136, 204, 0.2);
        }

        .btn-card .badge-web {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .btn-card:hover .badge-tg {
            background: #0099ee;
        }

        .btn-card:hover .badge-web {
            background: var(--gold);
            color: #0b0806;
        }

        /* ============================================================
                   ROW BUTTONS
                   ============================================================ */
        .row-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .btn-row {
            background: linear-gradient(145deg, #1c1610, #120e0a);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            flex: 0 1 auto;
            position: relative;
            overflow: hidden;
        }

        .btn-row::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 168, 75, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .btn-row:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(212, 168, 75, 0.1);
        }

        .btn-row:hover::before {
            opacity: 1;
        }

        .btn-row .icon {
            font-size: 30px;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        .btn-row .label {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        .btn-row .arrow {
            color: var(--gold);
            font-size: 20px;
            transition: transform 0.3s;
        }

        .btn-row:hover .arrow {
            transform: translateX(6px);
        }

        /* ============================================================
                   INFO BLOCK
                   ============================================================ */
        .info-block {
            background: linear-gradient(160deg, #1c1610, #0f0b08);
            border-radius: 24px;
            border: 1px solid var(--border-gold);
            padding: 44px 48px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .info-block::before {
            content: "𓋴";
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 160px;
            opacity: 0.025;
            font-family: serif;
            pointer-events: none;
        }

        .info-block-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 2px solid rgba(212, 168, 75, 0.1);
            padding-bottom: 14px;
        }

        .info-block-title .icon {
            font-size: 30px;
        }

        .info-block p {
            color: var(--text-secondary);
            line-height: 1.9;
            font-size: 16px;
            margin-bottom: 14px;
        }

        .info-block p strong {
            color: var(--gold);
            font-weight: 600;
        }

        .info-block ul {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .info-block ul li {
            padding: 6px 0 6px 34px;
            position: relative;
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 16px;
        }

        .info-block ul li::before {
            content: "✦";
            position: absolute;
            left: 6px;
            color: var(--gold);
            font-size: 18px;
        }

        /* ============================================================
                   FOOTER
                   ============================================================ */
        .footer {
            text-align: center;
            padding: 32px 20px 28px;
            color: #5a4e42;
            font-size: 13px;
            border-top: 1px solid rgba(212, 168, 75, 0.06);
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .footer-links a {
            color: var(--gold);
            transition: color 0.2s;
            font-weight: 400;
            letter-spacing: 0.5px;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: var(--gold-light);
            text-decoration: underline;
        }

        .footer-copy {
            color: #4a4038;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .footer-copy span {
            color: var(--gold);
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 820px) {
            .header h1 {
                font-size: 30px;
                letter-spacing: 4px;
            }
            .hero-title {
                font-size: 42px;
            }
            .hero-desc {
                font-size: 18px;
            }
            .hero-stats {
                gap: 20px;
            }
            .hero-stat {
                padding: 14px 24px;
                min-width: 100px;
            }
            .hero-stat .number {
                font-size: 34px;
            }
            .grid-buttons {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
            }
            .btn-card {
                min-height: 180px;
                padding: 28px 16px;
            }
            .btn-card .icon {
                font-size: 44px;
            }
            .btn-card .btn-label {
                font-size: 19px;
            }
            .btn-row {
                padding: 14px 24px;
                flex: 1 1 auto;
                justify-content: center;
            }
            .btn-row .label {
                font-size: 16px;
            }
            .info-block {
                padding: 30px 28px;
            }
            .info-block-title {
                font-size: 26px;
            }
        }

        @media (max-width: 500px) {
            .header h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }
            .header h1::after {
                font-size: 14px;
                margin-left: 6px;
            }
            .header-sub {
                font-size: 10px;
                letter-spacing: 6px;
            }
